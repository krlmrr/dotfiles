# Disable the unused motherboard S/PDIF (IEC958) digital output so the only
# audio sink is the GPU HDMI (monitor speakers).

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_00_1f.3.iec958.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]