onboarding = false

[theme]
name = "one-dark"

auto_switch = true
dark_name = "one-dark"
light_name = "one-light"
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read.
panel_bg = "black"

[terminal]
# Every split, tab and workspace opens in the current pane's directory.
new_cwd = "follow"

[ui]
accent = "blue"

pane_gaps = false
pane_outer_borders = false
pane_borders = "off"

pane_scrollbars = false

confirm_close = true

prompt_new_tab_name = false

mouse_capture = true

hide_tab_bar_when_single_tab = true

tab_bar_right = [{ type = "zoom" }]

sidebar_collapsed_mode="hidden"

# What Hyprland shows in the group bar. Resolved on the server, so a remote
# session names the remote host.
window_title = "{hostname}: {workspace}"

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+alt+c"
type = "shell"
command = "~/.local/bin/herdr-tabs"
