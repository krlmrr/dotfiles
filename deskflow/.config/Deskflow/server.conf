# Deskflow server layout for omarchy-mini (the server: its keyboard and mouse
# drive both machines). The MacBook sits to the left of the mini PC's monitor.
# The Mac's Deskflow "Computer name" must match the name below exactly.
# Deskflow 1.27+ declares the computers themselves in Deskflow.conf
# ([computer_<name>] sections), not in a `screens` section here.

section: links
	omarchy-mini:
		left = 16-macbook-pro
	16-macbook-pro:
		right = omarchy-mini
end

section: options
	clipboardSharing = true
	switchDelay = 250
end
