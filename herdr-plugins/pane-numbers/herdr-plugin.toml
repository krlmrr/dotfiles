id = "krlmrr.pane-numbers"
name = "Pane numbers"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Number the panes in a tab and jump to one by its number"
platforms = ["linux", "macos"]

[[actions]]
id = "show"
title = "Show pane numbers"
contexts = ["workspace"]
command = ["python3", "pane_numbers.py", "show"]

[[actions]]
id = "jump-1"
title = "Jump to pane 1"
contexts = ["workspace"]
command = ["python3", "pane_numbers.py", "jump", "1"]

