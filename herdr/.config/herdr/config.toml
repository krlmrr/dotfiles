onboarding = false

[theme]
name = "one-dark"
auto_switch = true
dark_name = "one-dark"
light_name = "one-light"

[theme.custom]
panel_bg = "black"

[terminal]
new_cwd = "follow"

[ui]
accent = "blue"

pane_gaps = false
pane_outer_borders = false
pane_borders = "off"

pane_scrollbars = false

confirm_close = true

prompt_new_tab_name = false

mouse_capture = true

hide_tab_bar_when_single_tab = true

tab_bar_right = [{ type = "zoom" }]

sidebar_collapsed_mode="hidden"

window_title = "{hostname}: {workspace}"

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+alt+c"
type = "shell"
command = "~/.local/bin/herdr-tabs"
