# Pin the GPU HDMI audio to the VG27AQL1A (hdmi-output-0, profile
# output:hdmi-stereo). Without this, WirePlumber switches to the ASUS PB278
# (HDMI 2) whenever the VG27AQL1A is off/asleep when audio comes up, then
# remembers that choice.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_01_00.1"
      }
    ]
    actions = {
      update-props = {
        device.profile = "output:hdmi-stereo-extra1"
        api.acp.auto-profile = false
      }
    }
  }
]
